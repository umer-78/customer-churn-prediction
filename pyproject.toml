[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "End-to-end churn prediction in Python: a synthetic, reproducible dataset, a feature pipeline, three models and a majority-class baseline compared on one split, charts, a model card and a scoring CLI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.3", "matplotlib>=3.7", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.8"]

[project.scripts]
churn = "churn.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# An explicit rule set, rather than whatever the newest ruff turns on by default:
# an unpinned linter with implicit rules means CI breaks on someone else's release
# schedule, not on a change to this code.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
